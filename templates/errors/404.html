{% extends "base.html" %}
{% block title %}404 Not Found — Resource Missing{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="bio-card p-5 shadow-sm">
                <div class="display-1 fw-bold text-teal mb-3">404</div>
                <h2 class="h3 fw-semibold mb-3">Experiment or Page Not Found</h2>
                <p class="text-muted mb-4">
                    The requested analytics view, dataset ID, or endpoint could not be located in the BioSense platform registry.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary px-4 rounded-pill">
                        <i class="bi bi-house me-1"></i>Return Home
                    </a>
                    <a href="{{ url_for('dashboard.index') }}" class="btn btn-teal px-4 rounded-pill">
                        <i class="bi bi-speedometer2 me-1"></i>Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
